services:
  api:
    build: .
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts

  dashboard:
    build: .
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
